# On every push and pull request: the engine's tests in Node, the reader's page in Chromium, the extension in
# Chromium, and the extension's packed dictionary and index against the reader's files.
name: Check
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and its Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: The engine, in Node
        run: node engine-test.js
        working-directory: check
      - name: The reader's page, in Chromium
        run: bash run.sh reader-test.js
        working-directory: check
      - name: The extension, in Chromium
        run: node extension-test.js
        working-directory: check
      - name: The extension's packed dictionary and word index
        run: node dict-test.js
        working-directory: check
      - name: kuromoji.js is the published build with the patch applied
        run: tools/kuromoji/patch.sh check
